<!DOCTYPE html>
<html>
<head>
    <title>Verify UI</title>
    <script>
        async function verify() {
            // Get the UI HTML
            const response = await fetch('http://localhost:3001/ui/');
            const html = await response.text();
            
            // Create iframe to test
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '2px solid blue';
            iframe.srcdoc = html;
            document.getElementById('preview').appendChild(iframe);
            
            // Wait for iframe to load
            setTimeout(() => {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const root = iframeDoc.getElementById('root');
                
                const results = [];
                results.push(`Root element exists: ${!!root}`);
                if (root) {
                    results.push(`Root innerHTML length: ${root.innerHTML.length}`);
                    results.push(`Root children: ${root.children.length}`);
                    
                    if (root.innerHTML.includes('Loading React')) {
                        results.push('⚠️ Still showing "Loading React..." - React may not be rendering');
                    }
                    if (root.innerHTML.includes('ECDIS')) {
                        results.push('✅ ECDIS content found!');
                    }
                }
                
                // Check for scripts
                const scripts = iframeDoc.querySelectorAll('script');
                results.push(`Scripts found: ${scripts.length}`);
                
                document.getElementById('results').innerHTML = results.join('<br>');
            }, 2000);
        }
        
        window.onload = verify;
    </script>
    <style>
        body { font-family: monospace; padding: 20px; }
        #results { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>UI Verification</h1>
    <div id="results">Checking...</div>
    <h2>Preview:</h2>
    <div id="preview"></div>
</body>
</html>
