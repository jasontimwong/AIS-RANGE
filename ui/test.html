<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UI Test</title>
    <script>
        // Test frontend by making API calls
        async function testUI() {
            console.log('Testing UI endpoints...');
            
            // Test if dev server is running
            try {
                const res = await fetch('http://localhost:3001/ui/');
                console.log('Dev server status:', res.status);
                
                // Test backend
                const backendRes = await fetch('http://localhost:8000/status');
                const backendData = await backendRes.json();
                console.log('Backend status:', backendData);
                
                // Test ENC endpoint
                const encRes = await fetch('http://localhost:8000/enc/lite');
                const encData = await encRes.json();
                console.log('ENC data available:', !!encData.coast);
                
                document.getElementById('results').innerHTML = `
                    <h2>✅ Test Results</h2>
                    <p>Frontend Dev Server: Running on port 3001</p>
                    <p>Backend API: ${backendData.status}</p>
                    <p>ENC Data: ${encData.coast ? 'Available' : 'Not found'}</p>
                    <p><a href="http://localhost:3001/ui/" target="_blank">Open UI →</a></p>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <h2>❌ Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        window.onload = testUI;
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>ECDIS UI Status Check</h1>
    <div id="results">Loading...</div>
</body>
</html>
